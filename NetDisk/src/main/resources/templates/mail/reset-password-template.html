<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>密码重置通知</title>
	<style>
		/* For progressive enhancement, not all clients support this */
		@media screen and (max-width: 600px) {
			.container {
				width: 100% !important;
				border-radius: 0 !important;
			}

			.content-padding {
				padding: 30px 20px !important;
			}
		}
	</style>
</head>
<body style="margin: 0; padding: 0; background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';">
<table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%"
       style="border-collapse: collapse;">
	<tr>
		<td align="center" style="padding: 20px 0;">
			<table role="presentation" class="container" align="center" border="0" cellpadding="0" cellspacing="0"
			       width="600"
			       style="border-collapse: collapse; background-color: #ffffff; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08);">
				<tr>
					<td align="center"
					    style="background: linear-gradient(to right, #6A82FB, #4A90E2); padding: 30px 0; border-top-left-radius: 12px; border-top-right-radius: 12px;">
						<h1 style="color: #ffffff; margin: 0; font-size: 32px; font-weight: 600; letter-spacing: 1px;">
							MikuNetDisk</h1>
					</td>
				</tr>
				<tr>
					<td class="content-padding" style="padding: 40px 40px;">
						<h2 style="color: #212529; font-size: 24px; margin-top: 0; margin-bottom: 20px; font-weight: 600;">
							密码重置通知</h2>
						<p style="color: #495057; font-size: 16px; line-height: 1.7; margin: 0 0 15px 0;">
							尊敬的用户，</p>
						<p style="color: #495057; font-size: 16px; line-height: 1.7; margin: 0 0 25px 0;">
							我们已收到您的密码重置请求。您的新密码已生成：</p>

						<table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0"
						       width="100%" style="margin-top: 20px; margin-bottom: 30px;">
							<tr>
								<td align="center"
								    style="background-color: #eef2f7; border-radius: 8px; padding: 20px; font-size: 24px; color: #343a40; font-weight: bold; letter-spacing: 2px; border: 1px solid #dee2e6;">
									__NEW_PASSWORD__
								</td>
							</tr>
						</table>

						<p style="color: #495057; font-size: 16px; line-height: 1.7; margin: 0 0 30px 0;">
							为了您的账户安全，请尽快使用新密码登录，并在“个人设置”中修改为您熟悉的密码。</p>

						<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
							<tr>
								<td align="center" style="padding-top: 10px; padding-bottom: 20px;">
									<a href="__LOGIN_URL__" target="_blank"
									   style="background: linear-gradient(to right, #28a745, #218838); color: #ffffff; padding: 15px 35px; text-decoration: none; border-radius: 50px; font-size: 18px; font-weight: 600; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">立即登录</a>
								</td>
							</tr>
						</table>

						<p style="color: #6c757d; font-size: 14px; line-height: 1.6; text-align: center; border-top: 1px solid #e9ecef; padding-top: 20px; margin: 20px 0 0 0;">
							如果您没有请求重置密码，请忽略此邮件，您的账户仍然是安全的。</p>
					</td>
				</tr>
				<tr>
					<td align="center"
					    style="background-color: #f1f3f5; padding: 20px 30px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
						<p style="color: #6c757d; margin: 0; font-size: 12px;">&copy; 2025 MikuNetDisk. All rights
							reserved.</p>
						<p style="color: #adb5bd; margin: 5px 0 0 0; font-size: 12px;">
							此为系统自动发送的邮件，请勿直接回复。</p>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
