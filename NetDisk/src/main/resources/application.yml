spring:
  datasource:
    url: jdbc:mysql://192.168.75.130:3306/cloud_disk?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    #配置 Druid 数据源
    type: com.alibaba.druid.pool.DruidDataSource
    username: root
    password: 123456

#    调试SQL日志配置 (Debug Logging Configuration)
#    p6spy:
#      # 日志格式
#      log-format: "\ntime:%(executionTime) || sql:%(sql)\n"
#      # 自定义日志类
#      logging: custom
#      custom-appender-class: com.zjj.netdisk.entity.config.StdoutLogger

    # ===================================================================
    # Druid 连接池详细配置 (Recommended Druid Pool Configuration)
    # ===================================================================
    druid:
      # ---- 基础配置 (Basic Settings) ----
      # 初始化连接池时建立的连接数
      initial-size: 8
      # 连接池中的最小空闲连接数
      min-idle: 8
      # 连接池中的最大活动连接数 (根据业务并发量调整)
      max-active: 30
      # 获取连接时最大等待时间，单位毫秒。配置-1表示无限制。
      max-wait: 10000

      # ---- 连接校验配置 (Connection Validation) ----
      # 检测连接是否有效的超时时间，单位秒
      validation-query-timeout: 3
      # 申请连接时执行 validationQuery 检测连接是否有效，配置为 true 会降低性能
      test-on-borrow: false
      # 归还连接时执行 validationQuery 检测连接是否有效，配置为 true 会降低性能
      test-on-return: false
      # 建议配置为 true，在连接空闲时检测，不影响性能
      test-while-idle: true
      # 用来检测连接是否有效的 SQL (MySQL 使用 SELECT 1)
      validation-query: SELECT 1
      # 连接空闲的最小时间，单位毫秒，超过这个时间的空闲连接才会被回收
      min-evictable-idle-time-millis: 300000
      # 检测需要关闭的空闲连接的间隔时间，单位毫秒
      time-between-eviction-runs-millis: 60000

      # ---- PSCache (PreparedStatement 缓存) ----
      # 是否缓存 PreparedStatement，对有重复 SQL 的应用性能有提升
      pool-prepared-statements: true
      # 单个连接上 PreparedStatement 缓存的大小
      max-pool-prepared-statement-per-connection-size: 20

      # ---- 监控和过滤器配置 (Monitoring & Filters) ----
      # 配置监控统计拦截的 filters，stat 用于统计，wall 用于防火墙，slf4j 用于日志
      filters: stat,wall,slf4j
      # 通过 connectProperties 属性来打开 mergeSql 功能；慢 SQL 记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

      # ---- Web 监控页面配置 (Stat View Servlet) ----
      stat-view-servlet:
        enabled: true
        # 访问监控页面的路径，最终访问地址为 http://localhost:8080/MikuNetDisk/druid
        url-pattern: /druid/*
        login-username: admin
        login-password: 123456
        # 是否能够重置数据
        reset-enable: false
      # ---- Web 监控过滤器配置 (Web Stat Filter) ----
      web-stat-filter:
        enabled: true
        # 监控所有请求
        url-pattern: /*
        # 排除静态资源和 Druid 监控页面自身的请求
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'

  application:
    name: NetDisk
  # Spring Data Redis 配置
  data:
    redis:
      host: 192.168.75.130
      port: 6379        # Redis 服务器端口，默认为 6379
      password: 123456
      timeout: 3000ms   # 连接超时时间（毫秒）
  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1050MB

server:
  servlet: # 正确的缩进
    context-path: /MikuNetDisk
  port: 8080

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: MikuNetDisk-token
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  isLog: true
  # 是否输出操作日志
  isColorLog: true

minio:
  endpoint: http://192.168.75.130:9000  # MinIO 服务器地址
  access-key: minioadmin    # 替换为你的 AccessKey
  secret-key: minioadmin     # 替换为你的 SecretKey
  bucket: netdisk-storage               # 默认存储桶名称
  secure: false                   # 是否使用 HTTPS（默认 false）
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: DEBUG
    org.springframework.web.accept: DEBUG
    org.springframework.http.converter.json: DEBUG # 查看 Jackson 转换器日志
